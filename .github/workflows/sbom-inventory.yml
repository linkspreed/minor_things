name: SBOM-Inventory

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: sbom-inventory
  cancel-in-progress: false

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Repo auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install --quiet -r requirements.txt > /dev/null 2>&1

      - name: Syft installieren
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin v1.18.1 > /dev/null 2>&1

      - name: SBOM-Inventar ausfuehren
        id: run_scan
        continue-on-error: true
        env:
          SRC_GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
          SRC_GH_OWNER: ${{ vars.SRC_GH_OWNER }}
          SRC_GH_OWNER_TYPE: ${{ vars.SRC_GH_OWNER_TYPE }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_SUMMARY_FILE: "sbom_inventory_summary.txt"
        run: python sbom_inventory.py > /dev/null 2>&1

      - name: Arbeitsdaten restlos entfernen
        if: always()
        run: rm -f sbom_inventory_summary.txt > /dev/null 2>&1 || true

      - name: Action-Lauf-Eintrag aus Historie loeschen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
        run: |
          curl -sSfL -X DELETE -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null 2>&1 || true

      - name: Lauf ggf. als fehlgeschlagen markieren
        if: steps.run_scan.outcome != 'success'
        run: exit 1
