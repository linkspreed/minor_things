name: Backup-Integritaetspruefung

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch: {}

concurrency:
  group: backup-integrity
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Repo auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Python einrichten
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install --quiet -r requirements.txt > /dev/null 2>&1

      - name: Integrität prüfen
        env:
          SRC_GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
          SRC_GH_OWNER: ${{ vars.SRC_GH_OWNER }}
          SRC_GH_OWNER_TYPE: ${{ vars.SRC_GH_OWNER_TYPE }}
          BACKUP_GH_TOKEN: ${{ secrets.BACKUP_GH_TOKEN }}
          BACKUP_GH_OWNER: ${{ vars.BACKUP_GH_OWNER }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
          GITLAB_URL: ${{ vars.GITLAB_URL }}
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: python backup_integrity.py > /dev/null 2>&1

      - name: Action-Lauf-Eintrag aus Historie loeschen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
        run: |
          curl -sSfL -X DELETE -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null 2>&1 || true
