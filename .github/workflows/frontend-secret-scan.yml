name: Frontend-Secret-Scan

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: frontend-secret-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repo auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install --quiet -r requirements.txt > /dev/null 2>&1

      - name: Frontend-Secret-Scan ausfuehren
        id: run_scan
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_EXCLUDE: ${{ secrets.CLOUDFLARE_ZONE_EXCLUDE }}
          FRONTEND_SCAN_IGNORE_HOSTS: ${{ secrets.FRONTEND_SCAN_IGNORE_HOSTS }}
          MAX_JS_FILES_PER_HOST: "25"
          MAX_BYTES_PER_FILE: "3000000"
          REQUEST_TIMEOUT_SECONDS: "15"
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_SUMMARY_FILE: "frontend_secret_scan_summary.txt"
        run: python frontend_secret_scan.py > /dev/null 2>&1

      - name: Arbeitsdaten restlos entfernen
        if: always()
        run: rm -f frontend_secret_scan_summary.txt > /dev/null 2>&1 || true

      - name: Lauf ggf. als fehlgeschlagen markieren
        if: steps.run_scan.outcome != 'success'
        run: exit 1
