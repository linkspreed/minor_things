name: Changelog-Aggregator

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

concurrency:
  group: changelog-aggregator
  cancel-in-progress: false

permissions: {}

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Python einrichten
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install --quiet -r requirements.txt > /dev/null 2>&1

      - name: Changelog aggregieren
        env:
          SRC_GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
          SRC_GH_OWNER: ${{ vars.SRC_GH_OWNER }}
          SRC_GH_OWNER_TYPE: ${{ vars.SRC_GH_OWNER_TYPE }}
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          CHANGELOG_LOOKBACK_DAYS: "7"
        run: python changelog_aggregator.py > /dev/null 2>&1
