name: Secret-Scan (Gitleaks)

on:
  schedule:
    # Stuendlich, 5 Minuten nach der vollen Stunde (leicht versetzt
    # zum CVE-Alarm, damit nicht beide Workflows exakt gleichzeitig
    # starten und sich Runner-Kapazitaet teilen)
    - cron: '5 * * * *'
  workflow_dispatch: {}

# Verhindert ueberlappende Laeufe. Bei sehr vielen/grossen Repos kann
# ein Lauf laenger als 1 Stunde dauern - dann "staut" sich das und du
# bekommst seltener als stuendlich eine Meldung. Siehe Laufzeit-Hinweis
# im Modul-Docstring von secret_scan.py.
concurrency:
  group: secret-scan
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install requests

      # Gitleaks als gepinntes Release-Binary installieren (kein
      # zusaetzliches "pip install" noetig, kein Docker-Overhead).
      # Version bei Bedarf hochziehen: https://github.com/gitleaks/gitleaks/releases
      - name: Gitleaks installieren
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret-Scan ausfuehren
        id: run_scan
        continue-on-error: true   # WICHTIG: Fehler hier darf die Benachrichtigung unten nicht verhindern
        env:
          SRC_GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
          SRC_GH_OWNER: ${{ vars.SRC_GH_OWNER }}
          SRC_GH_OWNER_TYPE: ${{ vars.SRC_GH_OWNER_TYPE }}
          QUIET_CONSOLE: "true"
          EMAIL_SUMMARY_FILE: "email_summary.txt"
          MAX_RETRIES: "3"
          RETRY_BASE_DELAY_SECONDS: "3"
        run: python secret_scan.py

      # Benachrichtigung ueber Google Chat - laeuft IMMER (if: always()).
      # Icon richtet sich nach Fund-Anzahl (FINDINGS_COUNT-Zeile),
      # NICHT nur nach dem technischen Erfolg des Scans.
      - name: Ergebnis an Google Chat senden
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCAN_OUTCOME: ${{ steps.run_scan.outcome }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import urllib.request

          outcome = os.environ.get("SCAN_OUTCOME", "unknown")
          run_url = os.environ.get("RUN_URL", "")
          webhook_url = os.environ.get("WEBHOOK_URL")

          try:
              with open("email_summary.txt", "r", encoding="utf-8") as f:
                  content = f.read()
          except FileNotFoundError:
              content = "Keine Zusammenfassung gefunden."

          findings_count = None
          for line in content.splitlines()[:3]:
              if line.startswith("FINDINGS_COUNT:"):
                  try:
                      findings_count = int(line.split(":", 1)[1].strip())
                  except ValueError:
                      findings_count = None
                  break

          if outcome != "success":
              icon = "❌"
          elif findings_count is None:
              icon = "❔"
          elif findings_count > 0:
              icon = "🔴"
          else:
              icon = "✅"

          max_len = 3500
          if len(content) > max_len:
              content = "...(gekuerzt)...\n" + content[-max_len:]

          text = f"{icon} Secret-Scan Ergebnis\n\n{content}\n\nDetails: {run_url}"
          payload = json.dumps({"text": text}).encode("utf-8")

          req = urllib.request.Request(
              webhook_url, data=payload,
              headers={"Content-Type": "application/json; charset=UTF-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Google Chat Antwort: HTTP {resp.status}")
          except Exception as e:
              print(f"Fehler beim Senden an Google Chat: {e}")
          PYEOF

      - name: Lauf ggf. als fehlgeschlagen markieren
        if: steps.run_scan.outcome != 'success'
        run: exit 1
