name: Visibility-Waechter

on:
  schedule:
    # Alle 15 Minuten - soll schnell reagieren, falls ein Repo
    # versehentlich public gestellt wird.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: visibility-guard
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Visibility prüfen
        env:
          SRC_GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
          SRC_GH_OWNER: ${{ vars.SRC_GH_OWNER }}
          SRC_GH_OWNER_TYPE: ${{ vars.SRC_GH_OWNER_TYPE }}
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: python visibility_guard.py
