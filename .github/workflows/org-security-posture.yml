name: Org-Security-Posture

on:
  schedule:
    - cron: '50 5 * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: org-security-posture
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install --quiet -r requirements.txt > /dev/null 2>&1

      - name: GitHub-Org-Sicherheitslage pruefen
        id: run_scan
        continue-on-error: true
        env:
          SRC_GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
          SRC_GH_OWNER: ${{ vars.SRC_GH_OWNER }}
          SRC_GH_OWNER_TYPE: ${{ vars.SRC_GH_OWNER_TYPE }}
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_SUMMARY_FILE: "org_security_posture_summary.txt"
        run: python github_org_security_posture.py > /dev/null 2>&1

      - name: Arbeitsdaten restlos entfernen
        if: always()
        run: rm -f org_security_posture_summary.txt > /dev/null 2>&1 || true

      - name: Lauf ggf. als fehlgeschlagen markieren
        if: steps.run_scan.outcome != 'success'
        run: exit 1
