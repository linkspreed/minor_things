name: Cross-Repo-Index

on:
  schedule:
    - cron: '0 2 * * 0'   # woechentlich, sonntags 02:00 UTC
  workflow_dispatch: {}

concurrency:
  group: cross-repo-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: ripgrep installieren
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Index bauen und hochladen
        env:
          SRC_GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
          SRC_GH_OWNER: ${{ vars.SRC_GH_OWNER }}
          SRC_GH_OWNER_TYPE: ${{ vars.SRC_GH_OWNER_TYPE }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: python cross_repo_index.py
