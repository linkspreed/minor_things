name: Repo Super-Backup

on:
  schedule:
    - cron: '0 5 * * *'    # ca. 07:00 Uhr Sommerzeit / 06:00 Uhr Winterzeit in München
    - cron: '0 17 * * *'   # ca. 19:00 Uhr Sommerzeit / 18:00 Uhr Winterzeit in München
  workflow_dispatch: {}     # erlaubt manuelles Starten über den "Run workflow"-Button

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Backup ausführen
        id: run_backup
        continue-on-error: true   # WICHTIG: Ein Fehler hier darf die Benachrichtigung unten nicht verhindern
        env:
          SRC_GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
          SRC_GH_OWNER: ${{ vars.SRC_GH_OWNER }}
          SRC_GH_OWNER_TYPE: ${{ vars.SRC_GH_OWNER_TYPE }}
          BACKUP_GH_TOKEN: ${{ secrets.BACKUP_GH_TOKEN }}
          BACKUP_GH_OWNER: ${{ vars.BACKUP_GH_OWNER }}
          BACKUP_GH_OWNER_TYPE: ${{ vars.BACKUP_GH_OWNER_TYPE }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
          GITLAB_URL: ${{ vars.GITLAB_URL }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_BACKUP_FOLDER_NAME: ${{ vars.GDRIVE_BACKUP_FOLDER_NAME }}
          QUIET_CONSOLE: "true"
          CLEAN_LOCAL_MIRROR_AFTER_EACH_REPO: "true"
          EMAIL_SUMMARY_FILE: "email_summary.txt"
        run: python backup_repos.py

      # -----------------------------------------------------------------
      # Benachrichtigung ueber GOOGLE CHAT statt E-Mail. Nur EIN Secret
      # noetig (die Webhook-URL) - kein SMTP, kein App-Passwort, kein
      # separates E-Mail-Konto. Die Webhook-URL ist selbst das Geheimnis
      # (wer sie hat, kann in den Space schreiben) - bleibt daher als
      # GitHub Secret, nirgendwo im Klartext sichtbar.
      #
      # if: always() sorgt dafuer, dass die Nachricht IMMER verschickt
      # wird - egal ob der Backup-Schritt oben erfolgreich war oder
      # fehlgeschlagen ist.
      #
      # Google Chat begrenzt Nachrichten auf max. 32.000 Byte - bei sehr
      # vielen Fehlern wird das Protokoll daher auf die letzten ca.
      # 4.000 Zeichen gekuerzt (siehe "tail" unten), damit der Versand
      # nicht selbst fehlschlaegt.
      # -----------------------------------------------------------------
      - name: Ergebnis an Google Chat senden
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKUP_OUTCOME: ${{ steps.run_backup.outcome }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import urllib.request

          outcome = os.environ.get("BACKUP_OUTCOME", "unknown")
          run_url = os.environ.get("RUN_URL", "")
          webhook_url = os.environ.get("WEBHOOK_URL")

          icon = "✅" if outcome == "success" else "❌"

          try:
              with open("email_summary.txt", "r", encoding="utf-8") as f:
                  content = f.read()
          except FileNotFoundError:
              content = "Keine Zusammenfassung gefunden."

          # Google Chat begrenzt Nachrichten auf 32.000 Byte - sicherheitshalber kuerzen
          max_len = 3500
          if len(content) > max_len:
              content = "...(gekuerzt)...\n" + content[-max_len:]

          text = f"{icon} Repo-Backup Ergebnis\n\n{content}\n\nDetails: {run_url}"
          payload = json.dumps({"text": text}).encode("utf-8")

          req = urllib.request.Request(
              webhook_url, data=payload,
              headers={"Content-Type": "application/json; charset=UTF-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Google Chat Antwort: HTTP {resp.status}")
          except Exception as e:
              print(f"Fehler beim Senden an Google Chat: {e}")
          PYEOF

      - name: Lauf ggf. als fehlgeschlagen markieren
        if: steps.run_backup.outcome != 'success'
        run: exit 1
