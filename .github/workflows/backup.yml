name: Repo Super-Backup

on:
  schedule:
    # Alle 6 Stunden = 4x täglich: 00:00, 06:00, 12:00, 18:00 UTC
    # (≈ 02:00, 08:00, 14:00, 20:00 Uhr Sommerzeit in München;
    #  ≈ 01:00, 07:00, 13:00, 19:00 Uhr Winterzeit in München)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}     # erlaubt manuelles Starten über den "Run workflow"-Button

# Verhindert, dass zwei Läufe gleichzeitig laufen (z.B. ein geplanter
# 6-Stunden-Trigger überschneidet sich mit einem manuellen Start). Ein
# neuer Lauf wartet, bis der vorherige fertig ist, statt parallel zu
# laufen.
concurrency:
  group: repo-super-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Backup ausführen
        id: run_backup
        continue-on-error: true   # WICHTIG: Ein Fehler hier darf die Benachrichtigung unten nicht verhindern
        env:
          # --- Quelle: dein Haupt-GitHub-Account ---
          SRC_GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
          SRC_GH_OWNER: ${{ vars.SRC_GH_OWNER }}
          SRC_GH_OWNER_TYPE: ${{ vars.SRC_GH_OWNER_TYPE }}
          # --- Ziel 1: zweiter GitHub-Account ---
          BACKUP_GH_TOKEN: ${{ secrets.BACKUP_GH_TOKEN }}
          BACKUP_GH_OWNER: ${{ vars.BACKUP_GH_OWNER }}
          BACKUP_GH_OWNER_TYPE: ${{ vars.BACKUP_GH_OWNER_TYPE }}
          # --- Ziel 2: GitLab-Account #1 (überschreibt/mirrort) ---
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
          GITLAB_URL: ${{ vars.GITLAB_URL }}
          # --- Ziel 3: GitLab-Account #2 (legt JEDEN Lauf neue, datierte Projekte an) ---
          GITLAB2_TOKEN: ${{ secrets.GITLAB2_TOKEN }}
          GITLAB2_NAMESPACE: ${{ vars.GITLAB2_NAMESPACE }}
          GITLAB2_URL: ${{ vars.GITLAB2_URL }}
          # --- Ziel 4: Google Drive ---
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_BACKUP_FOLDER_NAME: ${{ vars.GDRIVE_BACKUP_FOLDER_NAME }}
          # --- Allgemeine Einstellungen ---
          QUIET_CONSOLE: "true"
          CLEAN_LOCAL_MIRROR_AFTER_EACH_REPO: "true"
          EMAIL_SUMMARY_FILE: "email_summary.txt"
          MAX_RETRIES: "3"
          RETRY_BASE_DELAY_SECONDS: "3"
        run: python backup_repos.py

      # Benachrichtigung über Google Chat - läuft IMMER (if: always()),
      # egal ob der Backup-Schritt oben erfolgreich war oder nicht.
      - name: Ergebnis an Google Chat senden
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKUP_OUTCOME: ${{ steps.run_backup.outcome }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import urllib.request

          outcome = os.environ.get("BACKUP_OUTCOME", "unknown")
          run_url = os.environ.get("RUN_URL", "")
          webhook_url = os.environ.get("WEBHOOK_URL")

          icon = "✅" if outcome == "success" else "❌"

          try:
              with open("email_summary.txt", "r", encoding="utf-8") as f:
                  content = f.read()
          except FileNotFoundError:
              content = "Keine Zusammenfassung gefunden."

          max_len = 3500
          if len(content) > max_len:
              content = "...(gekuerzt)...\n" + content[-max_len:]

          text = f"{icon} Repo-Backup Ergebnis\n\n{content}\n\nDetails: {run_url}"
          payload = json.dumps({"text": text}).encode("utf-8")

          req = urllib.request.Request(
              webhook_url, data=payload,
              headers={"Content-Type": "application/json; charset=UTF-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Google Chat Antwort: HTTP {resp.status}")
          except Exception as e:
              print(f"Fehler beim Senden an Google Chat: {e}")
          PYEOF

      - name: Lauf ggf. als fehlgeschlagen markieren
        if: steps.run_backup.outcome != 'success'
        run: exit 1
