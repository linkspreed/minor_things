name: Release-Factory
run-name: Release-Factory
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Sealed token from tools/seal_dispatch.py (contains repo, branch, tag - never enter them in plain text)"
        type: string
        required: true
      dry_run:
        description: "Build and verify only - do not push the tag or create the release"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release-factory
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet -r requirements.txt requests cryptography > /dev/null 2>&1
      - name: Build release
        id: run_rf
        continue-on-error: true
        env:
          SEALED_PAYLOAD: ${{ inputs.payload }}
          RF_DRY_RUN: ${{ inputs.dry_run }}
          DISPATCH_KEY: ${{ secrets.DISPATCH_KEY }}
          SRC_GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
          SRC_GH_OWNER: ${{ secrets.SRC_GH_OWNER || vars.SRC_GH_OWNER }}
          RELEASE_GIT_NAME: ${{ secrets.RELEASE_GIT_NAME }}
          RELEASE_GIT_EMAIL: ${{ secrets.RELEASE_GIT_EMAIL }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python release_factory.py > /dev/null 2>&1
      - name: Remove working data
        if: always()
        run: rm -rf rf_work rf_reports > /dev/null 2>&1 || true
      - name: Delete this run from the history
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SRC_GH_TOKEN }}
        run: |
          curl -sSfL -X DELETE -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null 2>&1 || true
      - name: Mark run as failed if needed
        if: steps.run_rf.outcome != 'success'
        run: exit 1
